<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libris — Livro</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        background: linear-gradient(180deg, #071a2c 0%, #081b2d 100%);
        color: #edf5ff;
      }

      .book-page-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 18px 40px;
      }

      .book-header {
        display: flex;
        gap: 22px;
        align-items: center;
        background: rgba(16, 31, 49, 0.9);
        border: 1px solid rgba(150, 180, 232, 0.12);
        border-radius: 24px;
        padding: 20px;
        margin-bottom: 22px;
      }

      .book-cover-large {
        width: 180px;
        min-width: 180px;
        height: 240px;
        border-radius: 18px;
        background-size: cover;
        background-position: center;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      }

      .book-header h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 2vw, 2.6rem);
      }

      .book-author {
        margin: 0 0 10px;
        color: #a5bad9;
        font-size: 1.06rem;
      }

      .book-meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      .book-meta-pill {
        background: rgba(105, 145, 255, 0.12);
        border: 1px solid rgba(146, 180, 255, 0.18);
        color: #edf5ff;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 0.76rem;
      }

      .book-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .book-link-btn,
      .book-back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        padding: 10px 16px;
        text-decoration: none;
        font-weight: 700;
        cursor: pointer;
      }

      .book-link-btn {
        background: linear-gradient(135deg, #7aaeff, #5f75ff);
        color: #fff;
      }

      .book-back-btn {
        border: 1px solid rgba(150, 180, 232, 0.18);
        background: rgba(17, 31, 49, 0.8);
        color: #edf5ff;
      }

      .book-reader-panel {
        background: rgba(16, 31, 49, 0.9);
        border: 1px solid rgba(150, 180, 232, 0.12);
        border-radius: 24px;
        overflow: hidden;
        margin-bottom: 22px;
      }

      .reader-frame {
        width: 100%;
        height: 780px;
        border: 0;
        background: #fff;
      }

      .book-reviews-panel {
        background: rgba(16, 31, 49, 0.9);
        border: 1px solid rgba(150, 180, 232, 0.12);
        border-radius: 24px;
        padding: 18px;
      }

      .book-reviews-panel h2 {
        margin: 0 0 16px;
        font-size: 1.2rem;
      }

      .book-review-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      .book-review-form input,
      .book-review-form textarea {
        width: 100%;
        border: 1px solid rgba(150, 180, 232, 0.2);
        background: rgba(18, 30, 46, 0.95);
        color: #edf5ff;
        border-radius: 10px;
        padding: 12px;
      }

      .book-review-form textarea {
        min-height: 110px;
        resize: vertical;
      }

      .submit-review-btn {
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #7aaeff, #5f75ff);
        color: #fff;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        align-self: flex-start;
      }

      .book-review-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .book-review-item {
        background: rgba(12, 22, 34, 0.8);
        border: 1px solid rgba(150, 180, 232, 0.12);
        border-radius: 16px;
        padding: 14px;
      }

      .book-review-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .book-review-item h4 {
        margin: 0 0 8px;
      }

      .book-review-item p {
        margin: 0;
        color: #dfeeff;
        line-height: 1.6;
      }

      .empty-reviews {
        color: #a9bfdc;
        background: rgba(12, 22, 34, 0.8);
        border: 1px solid rgba(150, 180, 232, 0.12);
        border-radius: 14px;
        padding: 12px;
      }

      @media (max-width: 780px) {
        .book-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .book-cover-large {
          width: 100%;
          max-width: 220px;
          height: 300px;
        }

        .reader-frame {
          height: 560px;
        }
      }
    </style>
  </head>
  <body>
    <div class="book-page-shell">
      <header class="book-header">
        <div class="book-cover-large" id="bookCover"></div>
        <div>
          <h1 id="bookTitle">Carregando...</h1>
          <p class="book-author" id="bookAuthor"></p>
          <div class="book-meta-row">
            <span class="book-meta-pill" id="bookGenre">Gênero</span>
            <span class="book-meta-pill" id="bookPages">Páginas</span>
            <span class="book-meta-pill" id="bookRating">Avaliação</span>
          </div>
          <div class="book-actions">
            <a class="book-link-btn" id="pdfLink" href="#" target="_blank" rel="noreferrer">Abrir PDF</a>
            <a class="book-back-btn" href="conteudo.html">Voltar ao catálogo</a>
          </div>
        </div>
      </header>

      <section class="book-reader-panel">
        <iframe id="bookViewer" class="reader-frame" title="Leitura do livro" allow="fullscreen"></iframe>
      </section>

      <section class="book-reviews-panel">
        <h2>Resenhas do livro</h2>

        <form class="book-review-form" id="bookReviewForm">
          <input type="text" name="title" placeholder="Título da sua resenha" required />
          <textarea name="review" placeholder="Escreva sua opinião sobre o livro..." required></textarea>
          <button type="submit" class="submit-review-btn">Publicar resenha</button>
        </form>

        <div class="book-review-list" id="bookReviewsList"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
