<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libris — Explorar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="app-shell">
    <main class="content-panel single-page-panel">
      <header class="topbar">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input id="exploreSearchInput" type="text" placeholder="Buscar títulos, autores e gêneros..." aria-label="Buscar livros" />
        </div>
        <div class="toolbar">
          <button type="button" aria-label="Configurações">⚙</button>
          <button type="button" aria-label="Favoritos">✦</button>
          <button type="button" aria-label="Menu">☰</button>
        </div>
      </header>

      <section class="feed-card standalone-panel">
        <div class="feed-header">
          <h2>Explorar</h2>
          <span class="muted-text">Descubra o próximo favorito</span>
        </div>

        <div class="filter-bar" data-genre-filters></div>
        <div id="exploreResults" class="explore-results" aria-live="polite"></div>
      </section>
    </main>

    <div class="auth-modal hidden" id="authModal">
      <div class="auth-card">
        <button type="button" class="close-modal" id="closeAuthModal" aria-label="Fechar modal">×</button>
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-auth="login">Entrar</button>
          <button type="button" class="auth-tab" data-auth="signup">Criar conta</button>
        </div>

        <form id="loginForm" class="auth-form active">
          <label>
            Email
            <input type="email" name="email" placeholder="seu@email.com" required />
          </label>
          <label>
            Senha
            <input type="password" name="password" placeholder="Sua senha" required />
          </label>
          <button type="submit" class="submit-btn">Entrar</button>
        </form>

        <form id="signupForm" class="auth-form profile-form">
          <label>
            Nome
            <input type="text" name="name" placeholder="Seu nome" required />
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="seu@email.com" required />
          </label>
          <label>
            Senha
            <input type="password" name="password" placeholder="Crie uma senha" required />
          </label>
          <button type="submit" class="submit-btn">Cadastrar</button>
        </form>
      </div>
    </div>

    <div class="auth-modal hidden" id="reviewModal">
      <div class="auth-card review-card">
        <button type="button" class="close-modal" data-close="reviewModal">×</button>
        <div class="review-header">
          <h3>Nova revisão</h3>
          <span>Compartilhe sua leitura</span>
        </div>
        <form id="reviewForm" class="review-form">
          <label>
            Título da resenha
            <input type="text" name="title" required />
          </label>
          <label>
            Livro
            <input type="text" name="book" required />
          </label>
          <label>
            Sua avaliação
            <textarea name="review" rows="5" required></textarea>
          </label>
          <div class="form-actions compact-actions">
            <button type="submit" class="submit-btn">Publicar</button>
            <button type="reset" class="reset-btn">Limpar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
